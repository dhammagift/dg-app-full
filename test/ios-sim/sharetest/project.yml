# A UI-test bundle with no host app of its own: it drives whatever is installed on the booted
# simulator (Safari, and through Safari's share sheet our extension). Generated by xcodegen in CI
# (build-app.yml, job ios-ui) — not part of App.xcodeproj on purpose: the app's project is
# Capacitor's, `cap sync` rewrites parts of it, and a test target there would be one more thing to
# keep out of its way.
name: ShareSheetTests
options:
  bundleIdPrefix: gift.dhamma.tests
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ShareSheetTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: gift.dhamma.tests.sharesheet
schemes:
  ShareSheetTests:
    build:
      targets:
        ShareSheetTests: all
    test:
      targets: [ShareSheetTests]
