# Safari shares a page URL with the Share Extension, and the app must come to the front with it.
#
# This is the one path the tour cannot drive. The extension runs in its OWN process, and iOS — not
# our code — decides whether it may open its host app: build 170 used extensionContext.open (only
# Today and iMessage extensions are served by it), 190 the openURL: selector through the responder
# chain (iOS 18 forces it to NO), 193 UIApplication.open directly (Xcode 26 refuses to build an
# extension with APPLICATION_EXTENSION_API_ONLY = NO), 195 the same method through its IMP. Each
# one failed differently on a phone, a day apart, which is what this flow is for.
#
# Maestro drives the system UI because the share sheet belongs to SpringBoard. Nothing is asserted
# here about what the app renders: the step that runs this flow reads the simulator's process list,
# which no webview can fake.
#
# The page is already open — the step navigates with simctl, so a mistake here costs no navigation.
appId: com.apple.mobilesafari
---
- takeScreenshot: 1-safari
# A fresh simulator's Safari greets iOS 26 users with a tip about the new "..." menu, and the tip
# covers the toolbar underneath it (run 203: the whole hierarchy was the popover).
- tapOn:
    id: "xmark.circle.fill"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-toolbar
# In iOS 26 Safari, Share lives in the "..." menu at the end of the address pill, and that button
# carries no label to match on — so it is tapped where it sits on this fixed 402x874 simulator.
- tapOn:
    point: "86%,93%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 3-menu
- tapOn:
    text: "^(Share…|Share|Поделиться…|Поделиться)$"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: 4-sheet
- tapOn: Dhamma.gift
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 5-after
