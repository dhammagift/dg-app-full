# Safari shares a page URL with the Share Extension, and the app must come to the front with it.
#
# This is the one path the tour cannot drive. The extension runs in its OWN process, and iOS — not
# our code — decides whether it may open its host app: build 170 used extensionContext.open (only
# Today and iMessage extensions are served by it), 190 the openURL: selector through the responder
# chain (iOS 18 forces it to NO), 193 UIApplication.open directly (Xcode 26 refuses to build an
# extension with APPLICATION_EXTENSION_API_ONLY = NO), 195 the same method through its IMP. Each
# one failed differently on a phone, a day apart, which is what this flow is for.
#
# Maestro drives the system UI because the share sheet belongs to SpringBoard. Nothing is asserted
# here about what the app renders: the step that runs this flow reads the simulator's process list,
# which no webview can fake.
#
# The page is already open — the step navigates with simctl, so a mistake here costs no navigation.
#
# Every reach for something is preceded by a wait for it to exist. Run 207 taught why: Maestro
# reported COMPLETED for a tap on "Dhamma.gift" while the screen showed a bare web page, so a green
# tap proves nothing on its own and only the waits below can fail honestly.
appId: com.apple.mobilesafari
---
- takeScreenshot: 1-safari
# A fresh simulator's Safari greets iOS 26 with a tip about its new "..." menu. It cannot be closed
# by its own button (matched by neither id nor label, runs 205-206) and it sits BEHIND the menu
# while still swallowing the next tap (run 207: the menu opened, then the tap meant for Share went
# to the tip instead). So: open the menu, dismiss everything, and only then do it for real.
- tapOn:
    point: "86%,93%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "50%,20%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 2-toolbar
# With the tip gone the toolbar answers to its own name, which a tap on coordinates does not
# reliably reach: the same 86%,93% opened this menu in run 207 and missed it in run 208.
- extendedWaitUntil:
    visible:
      id: "MoreMenuButton"
    timeout: 15000
- tapOn:
    id: "MoreMenuButton"
- extendedWaitUntil:
    visible:
      text: "Share"
    timeout: 15000
- takeScreenshot: 3-menu
- tapOn:
    text: "Share"
# The share sheet, and our extension in it. If this wait is what fails, the sheet opened and the
# app was not offered — a different bug from the one this flow is chasing.
- extendedWaitUntil:
    visible:
      text: "Dhamma.gift"
    timeout: 20000
- takeScreenshot: 4-sheet
- tapOn:
    text: "Dhamma.gift"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 5-after
