name: Build App

# Builds the offline SQLite databases + the Android APK entirely on GitHub's runner — the prod
# server has no disk headroom for this (core.db+lang_ru.db+lang_en.db alone are ~260MB, plus
# Gradle/Android SDK caches).
#
# THE UI IS NOT IN THIS REPOSITORY. It is generated at build time from a dg-node checkout:
# build-page.js turns dg-node's search/index.html into www/index.html, build-assets.js copies
# every asset that page references, build-toc-snapshot.js snapshots a running dg-fastify.js.
# Which dg-node commit is used is pinned by the DG_NODE_REF file at this repo's root (a branch
# name or tag), overridable per-run via the workflow_dispatch input below.
#
# dg-node has many git-tracked RELATIVE symlinks (reader/images/*.png, reader/css/index.css,
# siteroot/*, ...) that assume the exact prod directory depth:
#   /var/www/html/                    <- dhammagift/dg      (legacy PHP repo)
#   /var/www/html/nodejs/             <- dhammagift/dg-node (the website)
# A relative symlink resolves against the REAL (kernel-canonicalized) path, not any alias on top
# of it — so checking dg-node out somewhere else and symlink-ALIASING /var/www/html/nodejs to it
# does NOT make those symlinks resolve: Node's readdirSync/copyFileSync/__dirname all see the real
# underlying path. Both repos therefore land at their real absolute prod paths below, and
# DG_NODE_PATH points this repo's build scripts at that location (see paths.js).
#
# sc-data and offline-data don't have this problem: they're referenced only through
# nodejs/siteroot/data/{suttacentral.net,dhammagift}, which this workflow force-replaces with
# hand-made ABSOLUTE symlinks anyway — independent of checkout path depth, so they stay under the
# workspace-relative repos/ for simplicity.
#
# Checkout order matters: dg (legacy) MUST land first, since dg-node's target is nested inside it
# (/var/www/html/nodejs) — git clean would otherwise wipe a sibling checkout that arrived first.
#
# All repos are public, so no token needed for the checkouts.

on:
  # Every push builds — no tag needed to get an installable APK artifact (see the "Upload APK
  # artifact" step, which runs on every run). Tags/releases are for when there is actually
  # something to release: push one deliberately, don't tag routine work-in-progress commits.
  push:
  workflow_dispatch:
    inputs:
      dg_node_ref:
        description: 'dg-node branch or tag to build the UI from (default: contents of DG_NODE_REF)'
        required: false
        type: string
      online_origin:
        description: 'Site the app talks to (default: dhamma.gift; https://test.dhamma.gift to try unreleased site changes)'
        required: false
        type: string

env:
  # Builds talk to dhamma.gift (owner, 2026-09-15: the site's app layer is deployed to prod). For
  # unreleased site changes run the workflow by hand with online_origin=https://test.dhamma.gift.
  DG_ONLINE_ORIGIN: ${{ inputs.online_origin || 'https://dhamma.gift' }}
  REPOS_ROOT: ${{ github.workspace }}/repos
  DG_NODE_PATH: /var/www/html/nodejs
  # Port dg-fastify.js is started on for the TOC snapshot — see that step for why it is pinned.
  DG_SERVER_PORT: '3000'

jobs:
  build:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only on this org; action-gh-release below needs
    # contents: write to create a release on a tag push, and fails with a 403 without it (never
    # caught before because every prior CI run here was workflow_dispatch, which the Create
    # Release step skips entirely).
    permissions:
      contents: write

    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      # The pin lives in a committed file rather than only in this workflow so a dg-node upgrade
      # is a reviewable one-line diff, and so local builds can read the same value.
      # Read once, near the top, so both the artifact names and the release step (near the bottom
      # of this job) can use it without re-parsing build.gradle.
      - name: Read app version
        id: appver
        run: |
          name=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Resolve dg-node ref
        id: pin
        run: |
          REF="${{ inputs.dg_node_ref }}"
          if [ -z "$REF" ]; then REF="$(tr -d '[:space:]' < DG_NODE_REF)"; fi
          if [ -z "$REF" ]; then echo "::error::DG_NODE_REF is empty and no dg_node_ref input given"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building UI from dg-node@$REF"

      - name: Prepare workspace layout
        run: |
          sudo mkdir -p /var/www/html
          sudo chown -R "$(id -u):$(id -g)" /var/www/html
          mkdir -p "$REPOS_ROOT/sc-data"
          mkdir -p "$REPOS_ROOT/offline-data"

      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory /var/www/html
          git config --global --add safe.directory /var/www/html/nodejs
          git config --global --add safe.directory "$REPOS_ROOT/sc-data"
          git config --global --add safe.directory "$REPOS_ROOT/offline-data"

      # actions/checkout@v4 REFUSES any `path:` outside $GITHUB_WORKSPACE ("Repository path
      # '/var/www/html' is not under ...") with no supported override, and these two must land at
      # the real prod paths (see header). Plain git has no such restriction.
      #
      # "read" is checked out alongside assets/* — reader/css/index.css's relative symlink needs
      # /var/www/html/read/css/index.css to exist.
      - name: Checkout legacy dg (the asset trees the app copies)
        working-directory: /var/www/html
        run: |
          git init -q
          git remote add origin https://github.com/dhammagift/dg.git
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          # build-assets.js copies whole trees (ASSET_TREES/ASSET_LOOSE_FILES) for the pages the
          # app's menu links to — common/, grammar/, materials/, diff/, repeat-timer/ — and
          # verifies afterwards that every referenced file is in www/. A tree that this checkout
          # does not fetch is therefore a hard build failure, not a warning: that is exactly how
          # the first CI run of this workflow failed (assets/common and assets/grammar were
          # missing and the verification listed the History page and the grammar pages as
          # unreachable). Keep this list in step with build-assets.js.
          git sparse-checkout set \
            assets/img assets/css assets/js assets/svg assets/texts \
            assets/common assets/grammar assets/materials assets/diff assets/repeat-timer \
            read
          git fetch --depth 1 origin main -q
          git checkout -q FETCH_HEAD

      # Anonymous `git fetch origin <full-sha>` returns HTTP 401 for these repos (GitHub's
      # allowReachableSHA1InWant extension isn't enabled) — fetch by ref name, which is always in
      # the standard ref advertisement, and report the resolved commit for the build log.
      - name: Checkout dg-node (the website — source of the UI)
        run: |
          mkdir -p "$DG_NODE_PATH"
          cd "$DG_NODE_PATH"
          git init -q
          git remote add origin https://github.com/dhammagift/dg-node.git
          git fetch --depth 1 origin "${{ steps.pin.outputs.ref }}" -q
          git checkout -q FETCH_HEAD
          echo "dg-node@${{ steps.pin.outputs.ref }} = $(git rev-parse HEAD)"

      # structure/tree is NOT optional — dg-fastify.js's TOC_TREE_ROOT reads
      # .../sc-data/structure/tree/{sutta,vinaya,abhidhamma}/{code}-tree.json for every single
      # /api/toc/book/:code request. Missing it doesn't error at checkout time (sc_bilara_data
      # alone builds a perfectly valid skeleton/offline-db) — every book lookup just 404s at
      # request time instead, which is exactly what once silently broke the TOC snapshot 46/46.
      - name: Checkout SuttaCentral bilara data (public, root/variant/html/translation only)
        uses: actions/checkout@v4
        with:
          repository: suttacentral/sc-data
          path: repos/sc-data
          sparse-checkout: |
            sc_bilara_data
            structure
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout DhammaGift offline translations
        uses: actions/checkout@v4
        with:
          repository: dhammagift/offline-data
          path: repos/offline-data
          sparse-checkout: |
            dhammagift
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Create symlink structure for sc-data/offline-data
        run: |
          # NOTE: /var/www/html/suttacentral.net is deliberately NOT created here. The legacy dg
          # checkout (previous step) already brought it in as a git-tracked symlink pointing at
          # ../suttacentral.net — cone-mode sparse-checkout always includes root-level entries,
          # symlinks included, whatever the sparse dir list says. It therefore already IS an alias
          # for /var/www/suttacentral.net created below, and `mkdir -p` on it fails with "File
          # exists" (the directory entry exists even while its target does not). Only the real
          # target needs creating; the alias resolves through it, so sc-data needs no second
          # symlink under /var/www/html either.
          sudo mkdir -p /var/www/suttacentral.net
          sudo mkdir -p /var/www/offline-data
          sudo mkdir -p /offline-data

          sudo rm -f /var/www/suttacentral.net/sc-data || true
          sudo rm -f /var/www/offline-data/dhammagift || true
          sudo rm -f /offline-data/dhammagift || true

          # dblight.js / dg-light.js / lib/translation-sources.js all read from
          # .../suttacentral.net/sc-data/sc_bilara_data (prod has a real sc-data/ directory there).
          # Symlink the CHECKED-OUT sc-data dir itself — not its sc_bilara_data subfolder — one
          # level up so that "sc-data" path segment resolves. Placed under both /var/www/html and
          # /var/www so either relative layout works.
          sudo ln -s "$REPOS_ROOT/sc-data" /var/www/suttacentral.net/sc-data
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /var/www/offline-data/dhammagift
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /offline-data/dhammagift

          sudo chown -R "$(id -u):$(id -g)" /var/www/suttacentral.net /var/www/offline-data /offline-data || true

          # Replace the placeholder files that stand in for relative symlink targets in the
          # checked-out dg-node with real absolute symlinks — the same treatment prod gives
          # siteroot/data/<site>.
          DG_NODE_DATA="$DG_NODE_PATH/siteroot/data"
          sudo rm -rf "$DG_NODE_DATA/suttacentral.net" || true
          sudo ln -s /var/www/suttacentral.net "$DG_NODE_DATA/suttacentral.net"
          sudo rm -rf "$DG_NODE_DATA/dhammagift" || true
          sudo ln -s /offline-data/dhammagift "$DG_NODE_DATA/dhammagift"
          sudo chown -R "$(id -u):$(id -g)" "$DG_NODE_DATA" || true
          readlink -f "$DG_NODE_DATA/suttacentral.net" || true

      - name: Verify data layout resolves
        working-directory: /var/www/html/nodejs
        run: |
          test -d siteroot/data/suttacentral.net/sc-data/sc_bilara_data/root || { echo "::error::sc-data did not land where siteroot/data/suttacentral.net/sc-data expects it"; exit 1; }
          test -d siteroot/data/suttacentral.net/sc-data/structure/tree/sutta || { echo "::error::sc-data's structure/tree missing — every /api/toc/book/:code request 404s without it (TOC_TREE_ROOT in dg-fastify.js)"; exit 1; }
          test -d siteroot/data/dhammagift/translation/en || { echo "::error::offline-data did not land where siteroot/data/dhammagift expects it"; exit 1; }
          test -f /var/www/html/assets/js/textinfo.json || { echo "::error::legacy assets/js missing (textinfo.json) — build-search-db.js needs it"; exit 1; }
          test -f reader/images/favicon-name-black.png || { echo "::error::reader/images relative symlink didn't resolve — dg and dg-node must be checked out at their real absolute prod paths (see workflow header)"; exit 1; }
          test -f reader/css/index.css || { echo "::error::reader/css/index.css relative symlink didn't resolve — needs /var/www/html/read/css/index.css, check dg's sparse-checkout includes 'read'"; exit 1; }
          echo "Data layout OK."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /var/www/html/nodejs/node_modules
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # `cache: gradle` works here but did NOT in dg-node's version of this workflow: setup-java's
      # gradle-file glob (like hashFiles()) refuses to look outside $GITHUB_WORKSPACE, and there
      # the Android project lived under /var/www/html/nodejs/mobile — outside it. In this repo
      # android/ IS the workspace, so the cache is simply available. A small dividend of the split.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # Capacitor 8 (AGP 8.13) needs JDK 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package, which Google has
          # dropped from the SDK repository (sdkmanager: "Failed to find package 'tools'"), so the
          # step failed. Install only what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dg-node dependencies
        working-directory: /var/www/html/nodejs
        run: npm install --legacy-peer-deps --no-audit

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      # public/overrides/js/fontawesome-local.js is gitignored in dg-node and generated from its
      # @fortawesome devDependency. dg-node's own CI never ran this, so every APK it produced
      # shipped without the icon bundle — build-assets.js reported it as MISSING and carried on.
      - name: Build dg-node icon bundle (fontawesome-local.js)
        working-directory: /var/www/html/nodejs
        run: npm run build-icons

      # The app no longer builds a database of its own. dg-node builds dg.db from the corpus —
      # the same file the site queries — and the app cuts a language slice out of it. That is
      # what makes the two provably the same data rather than two readings of the same files.
      - name: Build dg.db (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-search-db

      # The offline layer (fetch shim, data worker, core bundle, sqlite-wasm) is built in dg-node and
      # copied into the app verbatim — see docs/OFFLINE_PWA_PLAN.md, "Этап 2". Building it here rather
      # than in the app is what keeps one core bundle for the site, the PWA and the app: the app's own
      # build-core-bundle.js is gone, and build-assets.js fails loudly if this step did not run.
      - name: Build the offline layer (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-offline

      # dg-fastify.js is what prod actually runs (dg-light.js was its predecessor, replaced there
      # entirely) — using it here too, not dg-light.js, means the TOC snapshot and the generated
      # settings/*.json files this build bakes in come from the SAME code path that answers the
      # live site, not a second, unmaintained implementation that can silently drift from it.
      # It needs dg.db to boot (throws if missing) — already built two steps above — which is also
      # why dblight.js's dg_db_light.json skeleton is gone from this workflow entirely: dg-fastify
      # reads its own skeleton out of dg.db directly, that file was only ever dg-light.js's input.
      #
      # app.listen() accepts connections immediately, while its async initServer()
      # (buildSettingsDemoCache — Aksharamukha conversion for every script — then
      # buildScriptListCache/buildLangCountsCache/buildTranslatorCatalogCache) keeps running in
      # the background and writes settings/{scripts,demo-data,lang-counts,translator-catalog}.json
      # only once done. Measured on dg-light.js: /api/toc answers in ~6s but translator-catalog.
      # json — the LAST file in that sequence — doesn't land until ~36s; killing the server before
      # then froze initServer() mid-way and left "Build assets" with permanently missing inputs.
      # Waiting on translator-catalog.json, not just /api/toc, closes that window — dg-fastify.js
      # runs the identical four functions in the identical order, so the same wait applies.
      #
      # PORT is set explicitly rather than relying on the default: dg-fastify.js's own default
      # (3000) happens to already match DG_SERVER_PORT, but pinning it here makes that agreement
      # explicit instead of coincidental.
      - name: Start dg-fastify.js (for the TOC snapshot and the generated settings files)
        working-directory: /var/www/html/nodejs
        env:
          PORT: ${{ env.DG_SERVER_PORT }}
        run: |
          npm run start:fastify > /tmp/dg-fastify.log 2>&1 &
          echo $! > /tmp/dg-fastify.pid
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:$PORT/api/toc" > /dev/null 2>&1 && [ -f settings/translator-catalog.json ]; then
              echo "dg-fastify.js is up on port $PORT and fully initialized (attempt $i)."
              exit 0
            fi
            echo "Attempt $i/45..."
            sleep 2
          done
          echo "::error::dg-fastify.js did not become fully ready within 90s on port $PORT"
          cat /tmp/dg-fastify.log
          exit 1

      # MUST run after dg-fastify.js has booted at least once: settings/{scripts,demo-data,
      # lang-counts,translator-catalog}.json are gitignored and written by the server at startup,
      # so on a fresh checkout they don't exist until it has run.
      #
      # The bundle is built in TWO phases on purpose, with the TOC snapshot in between: the page
      # first (build-page.js — dg-node's search/index.html with the native platform and bridge
      # injected), then the snapshot, then build-assets.js. build-assets.js refuses to run without
      # www/api-snapshots/toc.json now — the navigator answers /api/toc from it, and when it went
      # missing the app showed "Failed to load TOC: /api/toc: HTTP 404" on a device.
      - name: Build the page (www/index.html)
        run: node build-page.js

      - name: Snapshot the offline TOC (needs dg-fastify.js from the previous step)
        run: npm run build-toc-snapshot -- --base=http://localhost:${{ env.DG_SERVER_PORT }}

      - name: Build web assets (www/**)
        run: node build-assets.js
        env:
          # Goes into www/app-version.json, i.e. the "App version" row — the same number gradle
          # gets as -PdgVersionCode below (see build-assets.js's writeAppVersion).
          DG_VERSION_CODE: ${{ github.run_number }}



      # The checks that run against the BUILT page in a real browser. They belong here and not
      # only on a workstation: the app once shipped with its data worker dead — every search and
      # every reader request failing on the device — because these ran in one place and CI ran
      # none of them. test/serve-local.js is deliberately no more permissive about MIME types than
      # Capacitor's asset server, so a module that would not load on a phone does not load here.
      # Used to rely on ubuntu-latest's pre-installed /usr/bin/google-chrome instead of installing
      # one — worked for months, then this exact step started failing this check near-instantly
      # (page errors, no diff output) with no code change anywhere near it, timing consistent with
      # chromium.launch() itself throwing rather than anything in the page. A system browser
      # nobody here pins the version of is exactly the kind of thing a runner-image update changes
      # out from under a workflow without any warning. `playwright install` pins an EXACT Chromium
      # build matched to this playwright-core version instead, the same guarantee build-app.yml
      # already gives every other dependency (npm's lockfile, DG_NODE_REF, the JDK/SDK versions).
      - name: Install a browser driver for the end-to-end checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          npm install --no-save playwright-core@1.49.1
          # The CLI's `install` subcommand lives in the "playwright" package, not the
          # library-only "playwright-core" this repo actually requires at runtime (confirmed
          # locally: `npx --package=playwright-core ... playwright install` fails instantly with
          # "playwright: not found" — playwright-core ships no such binary at all). Same version
          # pin either way, so both packages agree on which Chromium revision to fetch/resolve.
          npx --yes playwright@1.49.1 install --with-deps chromium

      # The app's own checks, run in dg-node against the server that is already up: every bundled
      # page compared with the live site (the "tile opens the search page" family — a missing path
      # is not a 404 in a WebView, it is index.html), and no referenced-but-absent file.
      - name: Check the app's pages against the site
        env:
          DG_APP_PATH: ${{ github.workspace }}
          DG_SITE_URL: http://localhost:${{ env.DG_SERVER_PORT }}
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        working-directory: /var/www/html/nodejs
        run: |
          node test/app-ui/check-pages.js
          node test/app-ui/check-assets.js

      # The parity reference: what THIS server answers, on the dg.db this run publishes below. The
      # committed test/snapshots/site came from a 2026-09-05 fixture database and no longer matched.
      - name: Capture the site's answers (parity reference)
        run: node test/capture.js --base=http://localhost:${{ env.DG_SERVER_PORT }} --out=test/snapshots/site

      # Only now: the page checks above compare the app against this server, and the TOC snapshot
      # came from it. Stopping it earlier left the checks with nothing to compare against.
      - name: Stop dg-fastify.js
        if: always()
        run: |
          if [ -f /tmp/dg-fastify.pid ]; then
            PID=$(cat /tmp/dg-fastify.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi


      # The offline library: the dg.db built above, published as dg.db.gz + db-manifest.json exactly
      # like prod (--no-build: no second build). It is BOTH what the browser checks below download
      # and what this run uploads, so the thing tested and the thing shipped are the same file.
      - name: Publish the offline library (dg-node)
        working-directory: /var/www/html/nodejs
        run: node build-search-db.js --no-build

      - name: List the offline library
        working-directory: /var/www/html/nodejs
        run: ls -lah siteroot/mobile-data/ || { echo "::error::publishing the offline library produced nothing"; exit 1; }

      - name: Serve the built app and its database
        run: |
          node test/serve-local.js www /var/www/html/nodejs/siteroot/mobile-data 8097 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8097/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8097/ >/dev/null || { echo "::error::the local test server never came up"; exit 1; }

      # Every /search, /api/text and /api/nav answer diffed against the snapshots captured from
      # the live site, plus the guard that the gear opens Settings rather than searching for the
      # word "settings".
      - name: Check the app answers exactly like the site
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        # pipefail: without it `| tee` reported success whatever e2e-browser.js returned, so a DIFF
        # never failed the build.
        run: |
          set -o pipefail
          node test/e2e-browser.js 2>&1 | tee e2e-output.log

      # Every link on the home page, search results, the reader (several modes), the TOC and
      # Settings, clicked for real against a server that resolves paths the way Capacitor does
      # (test/serve-local.js) — a link that is dead on the tablet fails here.
      - name: Click every link the way the device would
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/links.js 2>&1 | tee links-output.log

      # Job log downloads need admin rights on this repo, which this workflow's own token doesn't
      # have — an artifact is the one way to actually read what this step printed when it fails
      # without that. Only uploaded on failure: the log is redundant with the console output on a
      # normal green run, and would otherwise pile up 30 days of identical "24/24 identical"
      # files for nothing.
      - name: Upload e2e output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.run_number }}
          path: e2e-output.log
          retention-days: 7

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x android/gradlew

      # assembleDebug is auto-signed with the Android debug keystore (no secrets needed) — quick
      # to install for throwaway testing, but its signature can never match assetlinks.json
      # (see AndroidManifest.xml's autoVerify comment), so deep links on it always fall back to
      # the disambiguation chooser at best.
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        run: ls -lah android/app/build/outputs/apk/debug/ || echo "Debug APK directory not found"

      # Every run publishes the APK as a build artifact, so a workflow_dispatch build is
      # installable without tagging anything. The release below only happens for tag pushes:
      # action-gh-release needs a tag to attach to, and on a dispatch run there is none — that
      # is what failed run #3 after the APK itself had already built fine.
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release-signed build: the ONLY kind that can pass Android App Links verification (see
      # AndroidManifest.xml's autoVerify comment) — install this one, not the debug APK above, to
      # actually test deep links opening without the chooser dialog. Secrets are repo-level
      # (Settings -> Secrets and variables -> Actions), populated once from android.keystore's own
      # local android.keystore.readme (gitignored, never committed) and unrelated to Gradle's
      # own debug-keystore auto-signing above, which needs none of this.
      # Secret names: this repo's ANDROID_* or dg-twa's KEYSTORE_* — whichever set exists.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping the release build this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # The signing certificate's SHA-256 is public: it is what assetlinks.json must list for gift.dhamma.mobile.
        id: sig
        run: |
          ./gradlew assembleRelease -PdgVersionCode=${{ github.run_number }} --stacktrace
          digest=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256' | sed -E 's/.*: *//')
          echo "$digest"
          echo "cert=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # The AAB is what Google Play takes — an APK built from this same project cannot be uploaded
      # there, and until now the workflow produced only APKs (owner: "поправишь где надо git action
      # на сборку апок и aab"). Same keystore, same buildType: `bundleRelease` runs the identical
      # release variant and only changes the output packaging, so the AAB and the APK are the same
      # code signed by the same key.
      - name: Build Android Release AAB (Google Play)
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # Google Play's package for this listing is gift.dhamma.twa (the app replaces the TWA). Static shortcuts
        # name their package literally in res/xml, so that file follows the id; the test APK above keeps
        # gift.dhamma.mobile. ponytail: an in-place sed after the APK step, a Gradle-generated resource if it grows.
        run: |
          sed -i 's/android:targetPackage="gift.dhamma.mobile"/android:targetPackage="gift.dhamma.twa"/' app/src/main/res/xml/shortcuts.xml
          grep -c 'android:targetPackage="gift.dhamma.twa"' app/src/main/res/xml/shortcuts.xml
          ./gradlew bundleRelease -PdgAppId=gift.dhamma.twa -PdgVersionCode=${{ github.run_number }} --stacktrace

      - name: Upload release AAB artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-aab-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Kept as an artifact rather than committed anywhere, and attached to the release below on
      # tags so a tagged build is self-contained: the APK plus the exact database it expects.
      - name: Upload offline database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-db-${{ github.run_number }}
          path: |
            /var/www/html/nodejs/siteroot/mobile-data/dg.db.gz
            /var/www/html/nodejs/siteroot/mobile-data/db-manifest.json
          if-no-files-found: error
          retention-days: 30

      # Named, clearly-labelled copies for the two very different things this build produces — a
      # sideloadable APK (gift.dhamma.mobile, for testing) and the Google Play bundle (gift.dhamma.twa,
      # replaces the TWA listing) — so the release page doesn't just show two files both called
      # "app-release.*" with no way to tell which is which. The debug APK is a CI smoke-test build
      # (assembleDebug earlier in this job); it was attached to old releases by mistake and confused
      # "which one do I install" — dropped here, still in the per-run artifacts above if ever needed.
      - name: Rename release assets
        if: success() && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/dhamma-gift-${{ steps.appver.outputs.name }}-sideload.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/dhamma-gift-${{ steps.appver.outputs.name }}-play.aab"
          cp /var/www/html/nodejs/siteroot/mobile-data/dg.db.gz release-assets/
          cp /var/www/html/nodejs/siteroot/mobile-data/db-manifest.json release-assets/

      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            Built from dg-node@${{ steps.pin.outputs.ref }}, app version ${{ steps.appver.outputs.name }} (code ${{ github.run_number }}).

            - `*-sideload.apk` — package `gift.dhamma.mobile`, install directly on a device for testing. Points at https://dhamma.gift.
            - `*-play.aab` — package `gift.dhamma.twa`, upload to Google Play (updates the existing TWA listing).
            - `dg.db.gz` / `db-manifest.json` — the offline library this build expects.

            Signing certificate SHA-256: `${{ steps.sig.outputs.cert }}`
          token: ${{ secrets.GITHUB_TOKEN }}
