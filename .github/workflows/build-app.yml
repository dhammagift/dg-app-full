name: Build App

# Builds the offline SQLite databases + the Android APK entirely on GitHub's runner — the prod
# server has no disk headroom for this (core.db+lang_ru.db+lang_en.db alone are ~260MB, plus
# Gradle/Android SDK caches).
#
# THE UI IS NOT IN THIS REPOSITORY. It is generated at build time from a dg-node checkout:
# build-page.js turns dg-node's search/index.html into www/index.html, build-assets.js copies
# every asset that page references, build-toc-snapshot.js snapshots a running dg-fastify.js.
# Which dg-node commit is used is pinned by the DG_NODE_REF file at this repo's root (a branch
# name or tag), overridable per-run via the workflow_dispatch input below.
#
# dg-node has many git-tracked RELATIVE symlinks (reader/images/*.png, reader/css/index.css,
# siteroot/*, ...) that assume the exact prod directory depth:
#   /var/www/html/                    <- dhammagift/dg      (legacy PHP repo)
#   /var/www/html/nodejs/             <- dhammagift/dg-node (the website)
# A relative symlink resolves against the REAL (kernel-canonicalized) path, not any alias on top
# of it — so checking dg-node out somewhere else and symlink-ALIASING /var/www/html/nodejs to it
# does NOT make those symlinks resolve: Node's readdirSync/copyFileSync/__dirname all see the real
# underlying path. Both repos therefore land at their real absolute prod paths below, and
# DG_NODE_PATH points this repo's build scripts at that location (see paths.js).
#
# sc-data and offline-data don't have this problem: they're referenced only through
# nodejs/siteroot/data/{suttacentral.net,dhammagift}, which this workflow force-replaces with
# hand-made ABSOLUTE symlinks anyway — independent of checkout path depth, so they stay under the
# workspace-relative repos/ for simplicity.
#
# Checkout order matters: dg (legacy) MUST land first, since dg-node's target is nested inside it
# (/var/www/html/nodejs) — git clean would otherwise wipe a sibling checkout that arrived first.
#
# All repos are public, so no token needed for the checkouts.

on:
  # Every push builds — no tag needed to get an installable APK artifact (see the "Upload APK
  # artifact" step, which runs on every run). Tags/releases are for when there is actually
  # something to release: push one deliberately, don't tag routine work-in-progress commits.
  push:
  workflow_dispatch:
    inputs:
      dg_node_ref:
        description: 'dg-node branch or tag to build the UI from (default: contents of DG_NODE_REF)'
        required: false
        type: string
      online_origin:
        description: 'Site the app talks to (default: dhamma.gift; https://test.dhamma.gift to try unreleased site changes)'
        required: false
        type: string

env:
  # Builds talk to dhamma.gift (owner, 2026-09-15: the site's app layer is deployed to prod). For
  # unreleased site changes run the workflow by hand with online_origin=https://test.dhamma.gift.
  DG_ONLINE_ORIGIN: ${{ inputs.online_origin || 'https://dhamma.gift' }}
  REPOS_ROOT: ${{ github.workspace }}/repos
  DG_NODE_PATH: /var/www/html/nodejs
  # Port dg-fastify.js is started on for the TOC snapshot — see that step for why it is pinned.
  DG_SERVER_PORT: '3000'

jobs:
  build:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only on this org; action-gh-release below needs
    # contents: write to create a release on a tag push, and fails with a 403 without it (never
    # caught before because every prior CI run here was workflow_dispatch, which the Create
    # Release step skips entirely).
    permissions:
      contents: write

    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      # The pin lives in a committed file rather than only in this workflow so a dg-node upgrade
      # is a reviewable one-line diff, and so local builds can read the same value.
      # Read once, near the top, so both the artifact names and the release step (near the bottom
      # of this job) can use it without re-parsing build.gradle.
      - name: Read app version
        id: appver
        run: |
          name=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Resolve dg-node ref
        id: pin
        run: |
          REF="${{ inputs.dg_node_ref }}"
          if [ -z "$REF" ]; then REF="$(tr -d '[:space:]' < DG_NODE_REF)"; fi
          if [ -z "$REF" ]; then echo "::error::DG_NODE_REF is empty and no dg_node_ref input given"; exit 1; fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building UI from dg-node@$REF"

      - name: Prepare workspace layout
        run: |
          sudo mkdir -p /var/www/html
          sudo chown -R "$(id -u):$(id -g)" /var/www/html
          mkdir -p "$REPOS_ROOT/sc-data"
          mkdir -p "$REPOS_ROOT/offline-data"

      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory /var/www/html
          git config --global --add safe.directory /var/www/html/nodejs
          git config --global --add safe.directory "$REPOS_ROOT/sc-data"
          git config --global --add safe.directory "$REPOS_ROOT/offline-data"

      # actions/checkout@v4 REFUSES any `path:` outside $GITHUB_WORKSPACE ("Repository path
      # '/var/www/html' is not under ...") with no supported override, and these two must land at
      # the real prod paths (see header). Plain git has no such restriction.
      #
      # "read" is checked out alongside assets/* — reader/css/index.css's relative symlink needs
      # /var/www/html/read/css/index.css to exist.
      - name: Checkout legacy dg (the asset trees the app copies)
        working-directory: /var/www/html
        run: |
          git init -q
          git remote add origin https://github.com/dhammagift/dg.git
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          # build-assets.js copies whole trees (ASSET_TREES/ASSET_LOOSE_FILES) for the pages the
          # app's menu links to — common/, grammar/, materials/, diff/, repeat-timer/ — and
          # verifies afterwards that every referenced file is in www/. A tree that this checkout
          # does not fetch is therefore a hard build failure, not a warning: that is exactly how
          # the first CI run of this workflow failed (assets/common and assets/grammar were
          # missing and the verification listed the History page and the grammar pages as
          # unreachable). Keep this list in step with build-assets.js.
          git sparse-checkout set \
            assets/img assets/css assets/js assets/svg assets/texts \
            assets/common assets/grammar assets/materials assets/diff assets/repeat-timer \
            read
          git fetch --depth 1 origin main -q
          git checkout -q FETCH_HEAD

      # Anonymous `git fetch origin <full-sha>` returns HTTP 401 for these repos (GitHub's
      # allowReachableSHA1InWant extension isn't enabled) — fetch by ref name, which is always in
      # the standard ref advertisement, and report the resolved commit for the build log.
      - name: Checkout dg-node (the website — source of the UI)
        run: |
          mkdir -p "$DG_NODE_PATH"
          cd "$DG_NODE_PATH"
          git init -q
          git remote add origin https://github.com/dhammagift/dg-node.git
          git fetch --depth 1 origin "${{ steps.pin.outputs.ref }}" -q
          git checkout -q FETCH_HEAD
          echo "dg-node@${{ steps.pin.outputs.ref }} = $(git rev-parse HEAD)"

      # structure/tree is NOT optional — dg-fastify.js's TOC_TREE_ROOT reads
      # .../sc-data/structure/tree/{sutta,vinaya,abhidhamma}/{code}-tree.json for every single
      # /api/toc/book/:code request. Missing it doesn't error at checkout time (sc_bilara_data
      # alone builds a perfectly valid skeleton/offline-db) — every book lookup just 404s at
      # request time instead, which is exactly what once silently broke the TOC snapshot 46/46.
      - name: Checkout SuttaCentral bilara data (public, root/variant/html/translation only)
        uses: actions/checkout@v4
        with:
          repository: suttacentral/sc-data
          path: repos/sc-data
          sparse-checkout: |
            sc_bilara_data
            structure
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout DhammaGift offline translations
        uses: actions/checkout@v4
        with:
          repository: dhammagift/offline-data
          path: repos/offline-data
          sparse-checkout: |
            dhammagift
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Create symlink structure for sc-data/offline-data
        run: |
          # NOTE: /var/www/html/suttacentral.net is deliberately NOT created here. The legacy dg
          # checkout (previous step) already brought it in as a git-tracked symlink pointing at
          # ../suttacentral.net — cone-mode sparse-checkout always includes root-level entries,
          # symlinks included, whatever the sparse dir list says. It therefore already IS an alias
          # for /var/www/suttacentral.net created below, and `mkdir -p` on it fails with "File
          # exists" (the directory entry exists even while its target does not). Only the real
          # target needs creating; the alias resolves through it, so sc-data needs no second
          # symlink under /var/www/html either.
          sudo mkdir -p /var/www/suttacentral.net
          sudo mkdir -p /var/www/offline-data
          sudo mkdir -p /offline-data

          sudo rm -f /var/www/suttacentral.net/sc-data || true
          sudo rm -f /var/www/offline-data/dhammagift || true
          sudo rm -f /offline-data/dhammagift || true

          # dblight.js / dg-light.js / lib/translation-sources.js all read from
          # .../suttacentral.net/sc-data/sc_bilara_data (prod has a real sc-data/ directory there).
          # Symlink the CHECKED-OUT sc-data dir itself — not its sc_bilara_data subfolder — one
          # level up so that "sc-data" path segment resolves. Placed under both /var/www/html and
          # /var/www so either relative layout works.
          sudo ln -s "$REPOS_ROOT/sc-data" /var/www/suttacentral.net/sc-data
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /var/www/offline-data/dhammagift
          sudo ln -s "$REPOS_ROOT/offline-data/dhammagift" /offline-data/dhammagift

          sudo chown -R "$(id -u):$(id -g)" /var/www/suttacentral.net /var/www/offline-data /offline-data || true

          # Replace the placeholder files that stand in for relative symlink targets in the
          # checked-out dg-node with real absolute symlinks — the same treatment prod gives
          # siteroot/data/<site>.
          DG_NODE_DATA="$DG_NODE_PATH/siteroot/data"
          sudo rm -rf "$DG_NODE_DATA/suttacentral.net" || true
          sudo ln -s /var/www/suttacentral.net "$DG_NODE_DATA/suttacentral.net"
          sudo rm -rf "$DG_NODE_DATA/dhammagift" || true
          sudo ln -s /offline-data/dhammagift "$DG_NODE_DATA/dhammagift"
          sudo chown -R "$(id -u):$(id -g)" "$DG_NODE_DATA" || true
          readlink -f "$DG_NODE_DATA/suttacentral.net" || true

      - name: Verify data layout resolves
        working-directory: /var/www/html/nodejs
        run: |
          test -d siteroot/data/suttacentral.net/sc-data/sc_bilara_data/root || { echo "::error::sc-data did not land where siteroot/data/suttacentral.net/sc-data expects it"; exit 1; }
          test -d siteroot/data/suttacentral.net/sc-data/structure/tree/sutta || { echo "::error::sc-data's structure/tree missing — every /api/toc/book/:code request 404s without it (TOC_TREE_ROOT in dg-fastify.js)"; exit 1; }
          test -d siteroot/data/dhammagift/translation/en || { echo "::error::offline-data did not land where siteroot/data/dhammagift expects it"; exit 1; }
          test -f /var/www/html/assets/js/textinfo.json || { echo "::error::legacy assets/js missing (textinfo.json) — build-search-db.js needs it"; exit 1; }
          test -f reader/images/favicon-name-black.png || { echo "::error::reader/images relative symlink didn't resolve — dg and dg-node must be checked out at their real absolute prod paths (see workflow header)"; exit 1; }
          test -f reader/css/index.css || { echo "::error::reader/css/index.css relative symlink didn't resolve — needs /var/www/html/read/css/index.css, check dg's sparse-checkout includes 'read'"; exit 1; }
          echo "Data layout OK."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /var/www/html/nodejs/node_modules
            ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # `cache: gradle` works here but did NOT in dg-node's version of this workflow: setup-java's
      # gradle-file glob (like hashFiles()) refuses to look outside $GITHUB_WORKSPACE, and there
      # the Android project lived under /var/www/html/nodejs/mobile — outside it. In this repo
      # android/ IS the workspace, so the cache is simply available. A small dividend of the split.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # Capacitor 8 (AGP 8.13) needs JDK 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the legacy "tools" package, which Google has
          # dropped from the SDK repository (sdkmanager: "Failed to find package 'tools'"), so the
          # step failed. Install only what the build needs.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dg-node dependencies
        working-directory: /var/www/html/nodejs
        run: npm install --legacy-peer-deps --no-audit

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      # public/overrides/js/fontawesome-local.js is gitignored in dg-node and generated from its
      # @fortawesome devDependency. dg-node's own CI never ran this, so every APK it produced
      # shipped without the icon bundle — build-assets.js reported it as MISSING and carried on.
      - name: Build dg-node icon bundle (fontawesome-local.js)
        working-directory: /var/www/html/nodejs
        run: npm run build-icons

      # The app no longer builds a database of its own. dg-node builds dg.db from the corpus —
      # the same file the site queries — and the app cuts a language slice out of it. That is
      # what makes the two provably the same data rather than two readings of the same files.
      - name: Build dg.db (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-search-db

      # The offline layer (fetch shim, data worker, core bundle, sqlite-wasm) is built in dg-node and
      # copied into the app verbatim — see docs/OFFLINE_PWA_PLAN.md, "Этап 2". Building it here rather
      # than in the app is what keeps one core bundle for the site, the PWA and the app: the app's own
      # build-core-bundle.js is gone, and build-assets.js fails loudly if this step did not run.
      - name: Build the offline layer (dg-node)
        working-directory: /var/www/html/nodejs
        run: npm run build-offline

      # dg-fastify.js is what prod actually runs (dg-light.js was its predecessor, replaced there
      # entirely) — using it here too, not dg-light.js, means the TOC snapshot and the generated
      # settings/*.json files this build bakes in come from the SAME code path that answers the
      # live site, not a second, unmaintained implementation that can silently drift from it.
      # It needs dg.db to boot (throws if missing) — already built two steps above — which is also
      # why dblight.js's dg_db_light.json skeleton is gone from this workflow entirely: dg-fastify
      # reads its own skeleton out of dg.db directly, that file was only ever dg-light.js's input.
      #
      # app.listen() accepts connections immediately, while its async initServer()
      # (buildSettingsDemoCache — Aksharamukha conversion for every script — then
      # buildScriptListCache/buildLangCountsCache/buildTranslatorCatalogCache) keeps running in
      # the background and writes settings/{scripts,demo-data,lang-counts,translator-catalog}.json
      # only once done. Measured on dg-light.js: /api/toc answers in ~6s but translator-catalog.
      # json — the LAST file in that sequence — doesn't land until ~36s; killing the server before
      # then froze initServer() mid-way and left "Build assets" with permanently missing inputs.
      # Waiting on translator-catalog.json, not just /api/toc, closes that window — dg-fastify.js
      # runs the identical four functions in the identical order, so the same wait applies.
      #
      # PORT is set explicitly rather than relying on the default: dg-fastify.js's own default
      # (3000) happens to already match DG_SERVER_PORT, but pinning it here makes that agreement
      # explicit instead of coincidental.
      - name: Start dg-fastify.js (for the TOC snapshot and the generated settings files)
        working-directory: /var/www/html/nodejs
        env:
          PORT: ${{ env.DG_SERVER_PORT }}
        run: |
          npm run start:fastify > /tmp/dg-fastify.log 2>&1 &
          echo $! > /tmp/dg-fastify.pid
          for i in $(seq 1 45); do
            if curl -sf "http://localhost:$PORT/api/toc" > /dev/null 2>&1 && [ -f settings/translator-catalog.json ]; then
              echo "dg-fastify.js is up on port $PORT and fully initialized (attempt $i)."
              exit 0
            fi
            echo "Attempt $i/45..."
            sleep 2
          done
          echo "::error::dg-fastify.js did not become fully ready within 90s on port $PORT"
          cat /tmp/dg-fastify.log
          exit 1

      # MUST run after dg-fastify.js has booted at least once: settings/{scripts,demo-data,
      # lang-counts,translator-catalog}.json are gitignored and written by the server at startup,
      # so on a fresh checkout they don't exist until it has run.
      #
      # The bundle is built in TWO phases on purpose, with the TOC snapshot in between: the page
      # first (build-page.js — dg-node's search/index.html with the native platform and bridge
      # injected), then the snapshot, then build-assets.js. build-assets.js refuses to run without
      # www/api-snapshots/toc.json now — the navigator answers /api/toc from it, and when it went
      # missing the app showed "Failed to load TOC: /api/toc: HTTP 404" on a device.
      - name: Build the page (www/index.html)
        run: node build-page.js

      - name: Snapshot the offline TOC (needs dg-fastify.js from the previous step)
        run: npm run build-toc-snapshot -- --base=http://localhost:${{ env.DG_SERVER_PORT }}

      - name: Build web assets (www/**)
        run: node build-assets.js
        env:
          # Goes into www/app-version.json, i.e. the "App version" row — the same number gradle
          # gets as -PdgVersionCode below (see build-assets.js's writeAppVersion).
          DG_VERSION_CODE: ${{ github.run_number }}

      # The iOS job (bottom of this file) builds and tests the SAME bundle on a macOS runner. It
      # must not re-run this whole pipeline — the expensive part is dg-node's dg.db and the
      # dg-fastify boot, neither of which iOS needs (the app downloads dg.db at runtime, and the
      # simulator test uses the small fixture). So the bundle is passed across as an artifact, the
      # same bytes the Android APK is built from and the browser checks just ran against.
      # Uploaded here, immediately after the build, so a later failing check still leaves the
      # artifact for an ios-build run that is deliberately allowed to run on its result.
      - name: Upload the built web bundle (for the iOS job)
        uses: actions/upload-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www/
          retention-days: 1
          if-no-files-found: error



      # The checks that run against the BUILT page in a real browser. They belong here and not
      # only on a workstation: the app once shipped with its data worker dead — every search and
      # every reader request failing on the device — because these ran in one place and CI ran
      # none of them. test/serve-local.js is deliberately no more permissive about MIME types than
      # Capacitor's asset server, so a module that would not load on a phone does not load here.
      # Used to rely on ubuntu-latest's pre-installed /usr/bin/google-chrome instead of installing
      # one — worked for months, then this exact step started failing this check near-instantly
      # (page errors, no diff output) with no code change anywhere near it, timing consistent with
      # chromium.launch() itself throwing rather than anything in the page. A system browser
      # nobody here pins the version of is exactly the kind of thing a runner-image update changes
      # out from under a workflow without any warning. `playwright install` pins an EXACT Chromium
      # build matched to this playwright-core version instead, the same guarantee build-app.yml
      # already gives every other dependency (npm's lockfile, DG_NODE_REF, the JDK/SDK versions).
      # The dhammagift:// contract, checked as pure string work: 25 cases covering every documented
      # form and every documented refusal. It is the test for Android and iOS at once, because both
      # hand the same raw URL to the same mapping (src/deep-link.js) — and it needs nothing but node,
      # so it runs here rather than only on a macOS runner.
      - name: Check the deep-link contract
        run: node test/deep-link.test.js

      - name: Install a browser driver for the end-to-end checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          npm install --no-save playwright-core@1.49.1
          # webkit as well as chromium: the deep-link check below runs in both engines. Not because a
          # Linux WebKit is iOS (it is not — the simulator job tests the real WKWebView), but because
          # the same mapping and handoff are engine-independent code, and this is the cheapest place
          # to notice WebKit-only breakage in them.
          # The CLI's `install` subcommand lives in the "playwright" package, not the
          # library-only "playwright-core" this repo actually requires at runtime (confirmed
          # locally: `npx --package=playwright-core ... playwright install` fails instantly with
          # "playwright: not found" — playwright-core ships no such binary at all). Same version
          # pin either way, so both packages agree on which Chromium revision to fetch/resolve.
          npx --yes playwright@1.49.1 install --with-deps chromium webkit

      # The app's own checks, run in dg-node against the server that is already up: every bundled
      # page compared with the live site (the "tile opens the search page" family — a missing path
      # is not a 404 in a WebView, it is index.html), and no referenced-but-absent file.
      - name: Check the app's pages against the site
        env:
          DG_APP_PATH: ${{ github.workspace }}
          DG_SITE_URL: http://localhost:${{ env.DG_SERVER_PORT }}
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        working-directory: /var/www/html/nodejs
        run: |
          node test/app-ui/check-pages.js
          node test/app-ui/check-assets.js

      # The parity reference: what THIS server answers, on the dg.db this run publishes below. The
      # committed test/snapshots/site came from a 2026-09-05 fixture database and no longer matched.
      - name: Capture the site's answers (parity reference)
        run: node test/capture.js --base=http://localhost:${{ env.DG_SERVER_PORT }} --out=test/snapshots/site

      # Universal Links need this file served from the domain root, with no redirect and as
      # application/json — Apple rejects a redirect or a wrong Content-Type, which is exactly what a
      # generic static mount would produce. The Android counterpart (assetlinks.json) has its own
      # route; this checks the iOS one while the server is still up.
      - name: Check the Apple association file is served
        run: |
          set -o pipefail
          CT=$(curl -sS -o /tmp/aasa.json -w '%{content_type}' "http://localhost:${{ env.DG_SERVER_PORT }}/.well-known/apple-app-site-association")
          echo "content-type: $CT"
          case "$CT" in application/json*) ;; *) echo "::error::iOS rejects a wrong Content-Type for the association file ($CT)"; exit 1;; esac
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('/tmp/aasa.json'))
          ids = d['applinks']['details'][0]['appIDs']
          if not ids or not ids[0].endswith('.gift.dhamma.mobile'):
              sys.exit(f"::error::unexpected appIDs: {ids}")
          print('appIDs:', ids)
          if ids[0].startswith('TEAMID.'):
              print('::warning::the team id is still the placeholder — fill configs/apple-app-site-association before the first signed build')
          EOF

      # Only now: the page checks above compare the app against this server, and the TOC snapshot
      # came from it. Stopping it earlier left the checks with nothing to compare against.
      - name: Stop dg-fastify.js
        if: always()
        run: |
          if [ -f /tmp/dg-fastify.pid ]; then
            PID=$(cat /tmp/dg-fastify.pid)
            kill "$PID" 2>/dev/null || true
            sleep 1
            kill -9 "$PID" 2>/dev/null || true
          fi


      # The offline library: the dg.db built above, published as dg.db.gz + db-manifest.json exactly
      # like prod (--no-build: no second build). It is BOTH what the browser checks below download
      # and what this run uploads, so the thing tested and the thing shipped are the same file.
      - name: Publish the offline library (dg-node)
        working-directory: /var/www/html/nodejs
        run: node build-search-db.js --no-build

      - name: List the offline library
        working-directory: /var/www/html/nodejs
        run: ls -lah siteroot/mobile-data/ || { echo "::error::publishing the offline library produced nothing"; exit 1; }

      - name: Serve the built app and its database
        run: |
          node test/serve-local.js www /var/www/html/nodejs/siteroot/mobile-data 8097 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8097/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:8097/ >/dev/null || { echo "::error::the local test server never came up"; exit 1; }

      # Every /search, /api/text and /api/nav answer diffed against the snapshots captured from
      # the live site, plus the guard that the gear opens Settings rather than searching for the
      # word "settings".
      - name: Check the app answers exactly like the site
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        # pipefail: without it `| tee` reported success whatever e2e-browser.js returned, so a DIFF
        # never failed the build.
        run: |
          set -o pipefail
          node test/e2e-browser.js 2>&1 | tee e2e-output.log

      # Every link on the home page, search results, the reader (several modes), the TOC and
      # Settings, clicked for real against a server that resolves paths the way Capacitor does
      # (test/serve-local.js) — a link that is dead on the tablet fails here.
      - name: Click every link the way the device would
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/links.js 2>&1 | tee links-output.log

      # The Google sign-in handoff page (dg-node's siteroot/login/app-google.html), driven for real
      # with Firebase stubbed: after a popup sign-in it must return the ID token to the app, through
      # intent:// on Android and dhammagift:// on iOS. Both the iOS form and the fact that Android's
      # is unchanged are asserted — the page is shared with the shipped Android app, so a regression
      # here breaks sign-in on phones this repository no longer builds.
      - name: Check the Google sign-in handoff
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/login-handoff.test.js 2>&1 | tee login-handoff.log

      # The dhammagift:// handoff, on a real served bundle: /?_deepLink=<url> must land the SPA on a
      # page the contract promises, rendered from a database rather than merely changing the address.
      # This is the web half of the deep-link proof — Android's MainActivity builds exactly this URL,
      # and iOS calls the same mapping from its appUrlOpen handler. The other half runs in the iOS
      # simulator job (test/ios-sim/assert-deeplink.js).
      - name: Check the deep links land where they promise
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/deep-link-routes.js 2>&1 | tee deep-links-output.log

      # The same four links in WebKit. Routing is failed here as strictly as in Chromium; a missing
      # search-result marker is not — that needs OPFS, and WebKitGTK's storage is not WKWebView's
      # (iOS proves its own in the simulator job). The point is to catch engine-only breakage in the
      # handoff on a runner that costs seconds, not minutes.
      - name: Check the deep links in WebKit
        env:
          DG_PLAYWRIGHT: ${{ github.workspace }}/node_modules/playwright-core
          DG_BROWSER: webkit
          PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
        run: |
          set -o pipefail
          node test/deep-link-routes.js 2>&1 | tee deep-links-webkit.log

      # Job log downloads need admin rights on this repo, which this workflow's own token doesn't
      # have — an artifact is the one way to actually read what this step printed when it fails
      # without that. Only uploaded on failure: the log is redundant with the console output on a
      # normal green run, and would otherwise pile up 30 days of identical "24/24 identical"
      # files for nothing.
      - name: Upload e2e output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.run_number }}
          path: |
            e2e-output.log
            links-output.log
            deep-links-output.log
            deep-links-webkit.log
            login-handoff.log
          retention-days: 7

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant gradlew permissions
        run: chmod +x android/gradlew

      # assembleDebug is auto-signed with the Android debug keystore (no secrets needed) — quick
      # to install for throwaway testing, but its signature can never match assetlinks.json
      # (see AndroidManifest.xml's autoVerify comment), so deep links on it always fall back to
      # the disambiguation chooser at best.
      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: List build outputs
        run: ls -lah android/app/build/outputs/apk/debug/ || echo "Debug APK directory not found"

      # Every run publishes the APK as a build artifact, so a workflow_dispatch build is
      # installable without tagging anything. The release below only happens for tag pushes:
      # action-gh-release needs a tag to attach to, and on a dispatch run there is none — that
      # is what failed run #3 after the APK itself had already built fine.
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release-signed build: the ONLY kind that can pass Android App Links verification (see
      # AndroidManifest.xml's autoVerify comment) — install this one, not the debug APK above, to
      # actually test deep links opening without the chooser dialog. Secrets are repo-level
      # (Settings -> Secrets and variables -> Actions), populated once from android.keystore's own
      # local android.keystore.readme (gitignored, never committed) and unrelated to Gradle's
      # own debug-keystore auto-signing above, which needs none of this.
      # Secret names: this repo's ANDROID_* or dg-twa's KEYSTORE_* — whichever set exists.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — skipping the release build this run."
            echo "skip=true" >> "$GITHUB_ENV"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # The signing certificate's SHA-256 is public: it is what assetlinks.json must list for gift.dhamma.mobile.
        id: sig
        run: |
          ./gradlew assembleRelease -PdgVersionCode=${{ github.run_number }} --stacktrace
          digest=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256' | sed -E 's/.*: *//')
          echo "$digest"
          echo "cert=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-apk-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # The AAB is what Google Play takes — an APK built from this same project cannot be uploaded
      # there, and until now the workflow produced only APKs (owner: "поправишь где надо git action
      # на сборку апок и aab"). Same keystore, same buildType: `bundleRelease` runs the identical
      # release variant and only changes the output packaging, so the AAB and the APK are the same
      # code signed by the same key.
      - name: Build Android Release AAB (Google Play)
        if: env.skip != 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        # Google Play's package for this listing is gift.dhamma.twa (the app replaces the TWA). Static shortcuts
        # name their package literally in res/xml, so that file follows the id; the test APK above keeps
        # gift.dhamma.mobile. ponytail: an in-place sed after the APK step, a Gradle-generated resource if it grows.
        run: |
          sed -i 's/android:targetPackage="gift.dhamma.mobile"/android:targetPackage="gift.dhamma.twa"/' app/src/main/res/xml/shortcuts.xml
          grep -c 'android:targetPackage="gift.dhamma.twa"' app/src/main/res/xml/shortcuts.xml
          ./gradlew bundleRelease -PdgAppId=gift.dhamma.twa -PdgVersionCode=${{ github.run_number }} --stacktrace

      - name: Upload release AAB artifact
        if: success() && env.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-aab-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # Kept as an artifact rather than committed anywhere, and attached to the release below on
      # tags so a tagged build is self-contained: the APK plus the exact database it expects.
      - name: Upload offline database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-full-db-${{ github.run_number }}
          path: |
            /var/www/html/nodejs/siteroot/mobile-data/dg.db.gz
            /var/www/html/nodejs/siteroot/mobile-data/db-manifest.json
          if-no-files-found: error
          retention-days: 30

      # Named, clearly-labelled copies for the two very different things this build produces — a
      # sideloadable APK (gift.dhamma.mobile, for testing) and the Google Play bundle (gift.dhamma.twa,
      # replaces the TWA listing) — so the release page doesn't just show two files both called
      # "app-release.*" with no way to tell which is which. The debug APK is a CI smoke-test build
      # (assembleDebug earlier in this job); it was attached to old releases by mistake and confused
      # "which one do I install" — dropped here, still in the per-run artifacts above if ever needed.
      - name: Rename release assets
        if: success() && startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/dhamma-gift-${{ steps.appver.outputs.name }}-sideload.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/dhamma-gift-${{ steps.appver.outputs.name }}-play.aab"
          cp /var/www/html/nodejs/siteroot/mobile-data/dg.db.gz release-assets/
          cp /var/www/html/nodejs/siteroot/mobile-data/db-manifest.json release-assets/

      - name: Create Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body: |
            Built from dg-node@${{ steps.pin.outputs.ref }}, app version ${{ steps.appver.outputs.name }} (code ${{ github.run_number }}).

            - `*-sideload.apk` — package `gift.dhamma.mobile`, install directly on a device for testing. Points at https://dhamma.gift.
            - `*-play.aab` — package `gift.dhamma.twa`, upload to Google Play (updates the existing TWA listing).
            - `dg.db.gz` / `db-manifest.json` — the offline library this build expects.

            Signing certificate SHA-256: `${{ steps.sig.outputs.cert }}`
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------------------------
  # iOS: build the Capacitor project for the simulator on a macOS runner.
  #
  # A simulator build is the entire point of this job: it needs no Apple Developer account, no
  # signing certificate and no device — exactly what is available right now. It is also the only
  # check that the Swift side (plugins, Info.plist, storyboard, asset catalog) compiles at all:
  # the Android job cannot see any of it, and a broken pbxproj or Info.plist stays invisible until
  # somebody opens Xcode on a Mac.
  #
  # Why this runner and not macos-latest: Capacitor 8 requires Xcode 26.0+, and macos-15's DEFAULT
  # Xcode is 16.4, which cannot build this project at all. macos-26 ships Xcode 26.x and the
  # simulator runtimes iOS 26.x. Xcode is selected by glob (newest first) rather than by an exact
  # path: the image's set changes between runner releases, and a hardcoded
  # /Applications/Xcode_26.6.app would break the day the image moves on.
  #
  # The SPM template (Capacitor 8's default for `cap add ios`) means no CocoaPods and no Ruby step.
  #
  # Note the upload of the bundle in the `build` job above: this job re-uses the exact www/ the
  # Android APK and the browser checks were built from, instead of re-running dg-node's dg.db
  # pipeline, which iOS does not need (the app downloads dg.db itself at runtime).
  ios-build:
    name: iOS simulator build
    needs: build
    runs-on: macos-26
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # SwiftPM fetches capacitor-swift-pm and resolves every plugin package from GitHub on a cold
      # runner, and Xcode then compiles all of them into DerivedData — between them the slowest part
      # of these jobs. Cached, and cached BEFORE anything is installed or built:
      #   ~/.npm                                  the npm install below
      #   ~/Library/Caches/org.swift.swiftpm      the shared repository cache SwiftPM clones into
      #   ios/DerivedData/SourcePackages          the checkouts and build products these jobs use:
      #                                           both build with -derivedDataPath, so they are NOT
      #                                           under ~/Library/Developer/Xcode/DerivedData (the
      #                                           path generic CI advice names — a cache there would
      #                                           stay empty and save nothing)
      #   ~/Library/Developer/Xcode/DerivedData   kept for any build that runs without the flag
      # Keyed on what decides the dependency graph rather than on source: Package.swift (Capacitor's
      # exact version), the pbxproj (target and package wiring), Package.resolved if one is ever
      # committed, and package-lock.json (the npm packages the plugin packages are referenced from).
      # restore-keys means a run that bumps one of them still reuses the previous checkouts instead of
      # re-cloning everything.
      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Apple's required-reason APIs have to be DECLARED in the app's own PrivacyInfo.xcprivacy:
      # FileManager's size/timestamp/metadata reads, UserDefaults, system boot time, disk space and
      # active keyboards. This app avoids them instead — DgDownloadPlugin lists file NAMES only — so
      # there is no manifest to keep in step with anything, and this check is what keeps that true.
      # The day one of them appears, the build names the category to declare (FileTimestamp reason
      # C617.1 for app-container files) instead of leaving App Store upload to discover it.
      - name: Check for Apple required-reason APIs in our own Swift
        run: |
          if grep -nE "attributesOfItem|contentModificationDateKey|creationDateKey|fileModificationDate|resourceValues\(forKeys|UserDefaults\.standard|systemUptime|mach_absolute_time|volumeAvailableCapacity|\bstatfs?\(" ios/App/App/*.swift; then
            echo "::error::a required-reason API is used in our own Swift — either declare it in a PrivacyInfo.xcprivacy or stop using it"
            exit 1
          fi
          echo "no required-reason APIs in our own Swift"

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-build.log | tail -30

      # Job log downloads need admin rights on this repo, so an artifact is the only way to read a
      # failed xcodebuild's output (same reason the e2e job does this).
      - name: Upload the xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log-${{ github.run_number }}
          path: ios-build.log
          retention-days: 7
          if-no-files-found: ignore

      # The share extension is a second target: it builds into the app's PlugIns directory, and the
      # app is useless as a share target if it is missing or points at the wrong extension point.
      # Everything the extension DOES (read the payload, hand it over) is covered by the deep-link
      # checks: it delivers dhammagift://search?q=…, which is already a tested contract.
      - name: Check the share extension is inside the app
        run: |
          APP="ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          EX="$APP/PlugIns/ShareExtension.appex"
          test -d "$EX" || { echo "::error::the share extension is not embedded in the app"; exit 1; }
          xcrun plutil -p "$EX/Info.plist" | grep -q "com.apple.share-services" \
            || { echo "::error::the embedded extension is not a share extension"; xcrun plutil -p "$EX/Info.plist"; exit 1; }
          xcrun plutil -p "$EX/Info.plist" | grep -q "NSExtensionActivationSupportsText" \
            || { echo "::error::the extension no longer accepts text"; exit 1; }
          ls "$APP/PlugIns"
          echo "share extension embedded and configured"

      - name: Upload the simulator .app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-simulator-${{ github.run_number }}
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # iOS: run the real app in a simulator and prove the offline data layer works THERE.
  #
  # This is the check that matters most and the one that needs the least: no Apple account, no
  # certificate, no device, no server. The bundle is prepared so the fixture database sits inside the
  # app itself (/mobile-data) and every internet fallback points at a dead port, so a 200 answer can
  # only have come from the SQLite database opened in WKWebView through OPFS. Then CI reads the
  # app's own JSON report out of its container and fails on a wrong answer.
  #
  # It also produces the light/dark x en/ru screenshots the owner reviews — the same requirement the
  # web work is held to, on the platform where the WebView is a different engine.
  ios-ui:
    name: iOS simulator checks
    needs: build
    runs-on: macos-26
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      # SwiftPM fetches capacitor-swift-pm and resolves every plugin package from GitHub on a cold
      # runner, and Xcode then compiles all of them into DerivedData — between them the slowest part
      # of these jobs. Cached, and cached BEFORE anything is installed or built:
      #   ~/.npm                                  the npm install below
      #   ~/Library/Caches/org.swift.swiftpm      the shared repository cache SwiftPM clones into
      #   ios/DerivedData/SourcePackages          the checkouts and build products these jobs use:
      #                                           both build with -derivedDataPath, so they are NOT
      #                                           under ~/Library/Developer/Xcode/DerivedData (the
      #                                           path generic CI advice names — a cache there would
      #                                           stay empty and save nothing)
      #   ~/Library/Developer/Xcode/DerivedData   kept for any build that runs without the flag
      # Keyed on what decides the dependency graph rather than on source: Package.swift (Capacitor's
      # exact version), the pbxproj (target and package wiring), Package.resolved if one is ever
      # committed, and package-lock.json (the npm packages the plugin packages are referenced from).
      # restore-keys means a run that bumps one of them still reuses the previous checkouts instead of
      # re-cloning everything.
      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list devices available | head -20

      # The fixture is built from source (test/make-fixture-db.js needs no corpus and no dg.db):
      # a small database in the real schema, with the texts the self-test asks about.
      - name: Build the fixture database
        run: node test/make-fixture-db.js test/fixture.db

      # --library-dir: the fixture is NOT bundled this time. It is written beside the build and
      # copied into the app's own storage by drive.sh, so the app has to find it through
      # DgDownloadPlugin and import it from there — the native path, exercised with no network at
      # all (every origin in the bundle points at a dead port).
      - name: Turn www/ into a simulator test bundle
        run: node test/ios-sim/prepare-www.js --library-dir .tmp/ios-library

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-ui-build.log | tail -30

      - name: Run the app in the simulator and pull its report out
        run: test/ios-sim/drive.sh --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app --out .tmp/ios-ui --library .tmp/ios-library

      - name: Judge the report
        run: node test/ios-sim/assert.js .tmp/ios-ui/selftest.json

      # No gate on the deep link here on purpose: iOS shows its own "Open in Dhamma.gift?" prompt for
      # a custom scheme opened from OUTSIDE the app (SpringBoard, and `simctl openurl` behaves like
      # that), and a headless simulator cannot tap it — the app never receives the URL. The self-test
      # opens dhammagift://route/toc from the page instead, and the path it lands on is in the report
      # this job uploads; test/ios-sim/assert-deeplink.js is the assertion to run on a device or from
      # an XCUITest that can tap. docs/DEEP_LINKS.md says which half is automated.

      # Always, not only on failure: the screenshots ARE the deliverable for the owner (light/dark x
      # en/ru), and the report is what makes a red run diagnosable without admin rights on this repo.
      - name: Upload the report, the screenshots and the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-ui-${{ github.run_number }}
          path: |
            .tmp/ios-ui/selftest.json
            .tmp/ios-ui/*.png
            .tmp/ios-ui/app-console.log
            ios-ui-build.log
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # Screenshots of the app doing things — the owner's question was "why only the table of contents",
  # and the answer is that a store listing needs to show search results, a text in the reader, the
  # dictionary popup, settings, history.
  #
  # Which is why this job runs against the LIVE site instead of the fixture: three suttas and no
  # dictionary data make honest but useless pictures. The bundle declines the offline library so the
  # run does not spend its time downloading 216 MB, and every screenshot is taken on an iPhone 17
  # Pro Max because the App Store wants a 6.9" display.
  #
  # The page drives itself (test/ios-sim/tour.js): from outside the WebView nothing can press a
  # button, so the tour renders each view through the SPA's own router, taps a Pali word for the
  # dictionary, opens the settings sheet the way the app does, and writes the stage name to a file
  # the driver waits on — a screenshot at a guessed moment looks like a bug, not a gap.
  ios-screenshots:
    name: iOS screenshots (6.9", online)
    needs: build
    runs-on: macos-26
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm and SwiftPM caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # --online --tour: the real site, no fixture, no dead origin, download declined, and the tour
      # script instead of the self-test (see test/ios-sim/prepare-www.js).
      - name: Turn www/ into the screenshot-tour bundle
        run: node test/ios-sim/prepare-www.js --online --tour

      - name: Sync Capacitor into ios/
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ios-tour-build.log | tail -30

      # App Store Connect's iPhone slot for this app lists 1242x2688 and 1284x2778 — the 6.9" frame
      # (1320x2868) is not among them, so the submission set is taken on a 6.7" device. The runner
      # image ships only current iPhone types, so the device is CREATED from an older device type on
      # the newest iOS runtime: a device type is a hardware profile, and iOS 26 still runs iPhone 13
      # Pro Max (1284x2778, exactly the size the page accepts).
      - name: Prepare a 6.7" device (the size the store page accepts)
        id: sixseven
        run: |
          RUNTIME=$(xcrun simctl list runtimes | grep -Eo 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | sort -V | tail -1)
          TYPE=$(xcrun simctl list devicetypes | grep -Eo 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-1[1-3]-Pro-Max' | sort -V | tail -1)
          echo "runtime=$RUNTIME type=$TYPE"
          if [ -n "$RUNTIME" ] && [ -n "$TYPE" ]; then
            xcrun simctl create "DG-6.7" "$TYPE" "$RUNTIME" >/dev/null
            echo "device=DG-6.7" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not create a 6.7\" device — falling back to the iPhone 17 Pro Max (6.9\", which the store page may refuse)"
            echo "device=iPhone 17 Pro Max" >> "$GITHUB_OUTPUT"
          fi

      - name: Walk the app and take pictures (6.7", the submission size)
        run: |
          mkdir -p .tmp/ios-tour
          # The online tour needs the runner's network; a failure here must not be silent.
          curl -sf -o /dev/null --max-time 20 https://dhamma.gift/ || echo "::warning::dhamma.gift did not answer — the tour will show the app's offline states"
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour --device "${{ steps.sixseven.outputs.device }}" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      # Kept as well: a 6.9" set costs two minutes and covers the case where the store page shows the
      # newer slot instead (Apple has been moving new apps to 6.9").
      - name: The same tour on a 6.9" iPhone (in case the store asks for that size)
        run: |
          mkdir -p .tmp/ios-tour-69
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour-69 --device "iPhone 17 Pro Max" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      # The app declares TARGETED_DEVICE_FAMILY = "1,2", so App Store Connect wants a 13" iPad set as
      # well — and a submission without it is refused at the upload, not at the review. The same tour,
      # one more device.
      - name: The same tour on a 13" iPad (the other required screenshot size)
        run: |
          mkdir -p .tmp/ios-tour-ipad
          test/ios-sim/drive.sh --tour --out .tmp/ios-tour-ipad --device "iPad Pro 13-inch (M5)" \
            --app ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-screenshots-${{ github.run_number }}
          path: |
            .tmp/ios-tour/*.png
            .tmp/ios-tour/app-console.log
            .tmp/ios-tour-69/*.png
            .tmp/ios-tour-ipad/*.png
            .tmp/ios-tour-ipad/app-console.log
            ios-tour-build.log
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # The release path: archive, export and upload to TestFlight.
  #
  # It stays dormant until the account exists — every step that needs a secret checks for it first and
  # says what is missing, rather than failing a push that has nothing to do with releases. That is the
  # point of writing it now: the day the account lands, the only work left is pasting four values into
  # repo secrets (docs/IOS_ACCOUNT_DAY.md) and pressing Run workflow.
  #
  # Why TestFlight rather than an ad-hoc IPA: TestFlight installs on a phone with no Mac, no cable and
  # no registered UDID, which is exactly the situation the device checks are waiting on (background
  # download, audible TTS, the dictionary tap, the share sheet).
  ios-release:
    name: iOS release (TestFlight)
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    steps:
      - name: Checkout this repo (the app)
        uses: actions/checkout@v4

      - name: Download the built web bundle
        uses: actions/download-artifact@v4
        with:
          name: www-${{ github.run_number }}
          path: www

      - name: Are the signing secrets there?
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -z "$missing" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "signing secrets present"
            {
              echo "### iOS release"
              echo "Signing secrets found — archiving and uploading to TestFlight."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::notice::missing secrets:$missing — skipping the archive and the upload. See docs/IOS_ACCOUNT_DAY.md."
            # A green job that did nothing reads like a successful release. The summary is where that is
            # impossible to misread: nothing was built, nothing was uploaded.
            {
              echo "### iOS release: nothing happened"
              echo ""
              echo "Missing repository secrets: \`$missing\`"
              echo ""
              echo "No archive was made and nothing was uploaded to TestFlight. See docs/IOS_ACCOUNT_DAY.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.asc.outputs.have == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Restore npm and SwiftPM caches
        if: steps.asc.outputs.have == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            ios/DerivedData/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.pbxproj', 'ios/**/Package.resolved', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Install app dependencies
        if: steps.asc.outputs.have == 'yes'
        run: npm install --legacy-peer-deps --no-audit

      - name: Select the newest Xcode 26
        if: steps.asc.outputs.have == 'yes'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The key is written where xcodebuild expects it and removed at the end of the job by the
      # runner's own cleanup (RUNNER_TEMP is not cached, not uploaded, and not the workspace).
      - name: Write the App Store Connect key
        if: steps.asc.outputs.have == 'yes'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Sync Capacitor into ios/
        if: steps.asc.outputs.have == 'yes'
        run: npx cap sync ios

      # The bundle id, the team and the marketing version come from the project; only the build number
      # is injected (Play/App Store both refuse a number they have seen, and the run number is the one
      # value this repository already treats as one).
      #
      # The project keeps "iPhone Developer" for both configurations (that is what lets a phone build
      # with a personal team), so an archive would ask Apple for an iOS App Development profile — and
      # those need registered devices, which a fresh account has none of ("Your team has no devices
      # from which to generate a provisioning profile"). Forcing the distribution identity here makes
      # -allowProvisioningUpdates create an Apple Distribution profile instead, which needs no device.
      - name: Archive
        if: steps.asc.outputs.have == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/App.xcarchive \
            -derivedDataPath ios/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive 2>&1 | tee ios-archive.log | tail -30

      # app-store-connect is Xcode 15+'s name for what used to be `app-store`; the older spelling still
      # works, so a rename here is not a silent breakage.
      - name: Export the IPA
        if: steps.asc.outputs.have == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath ios/build/export \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee ios-export.log | tail -30

      # `destination: upload` in the export options is what performs the TestFlight upload; altool is
      # kept as an explicit fallback for the case where that path is unavailable (Apple's own tool is
      # deprecated but still accepts --apiKey/--apiIssuer).
      - name: Upload to TestFlight (fallback if the export did not)
        if: steps.asc.outputs.have == 'yes'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls ios/build/export/*.ipa 2>/dev/null | head -1 || true)
          if [ -z "$IPA" ]; then echo "::error::no IPA was produced"; exit 1; fi
          if xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -20; then
            echo "uploaded $IPA"
          else
            echo "::warning::altool could not upload — check TestFlight in App Store Connect; the IPA is uploaded as an artifact below"
          fi

      - name: Upload the archive log on failure
        if: failure() && steps.asc.outputs.have == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-logs-${{ github.run_number }}
          path: |
            ios-archive.log
            ios-export.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Say what went to TestFlight
        if: success() && steps.asc.outputs.have == 'yes'
        run: |
          IPA=$(ls ios/build/export/*.ipa 2>/dev/null | head -1 || echo '(no ipa)')
          {
            echo "### iOS release: uploaded"
            echo ""
            echo "Build ${{ github.run_number }} was archived and sent to TestFlight."
            echo "IPA: \`$IPA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA
        if: success() && steps.asc.outputs.have == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: dg-app-ios-ipa-${{ github.run_number }}
          path: ios/build/export/*.ipa
          retention-days: 30
          if-no-files-found: error
